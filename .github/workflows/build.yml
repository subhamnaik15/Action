name: Android Build & Email Notification

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  JAVA_VERSION: '11'
  GRADLE_VERSION: 'wrapper'

jobs:
  # Prepare job: determine whether the pushed commit is a merge commit
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_merge: ${{ steps.check.outputs.is_merge }}
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Check if commit is a merge
        run: |
          COMMIT=${{ github.sha }}
          # count words in git rev-list output: commit + parents
          PARENTS_COUNT=$(git rev-list --parents -n 1 $COMMIT | wc -w)
          # for a normal commit PARENTS_COUNT==2, for a merge (2 parents) ==3 or more
          if [ "$PARENTS_COUNT" -ge 3 ]; then
            echo "is_merge=true" >> "$GITHUB_OUTPUT"
            echo "Detected merge commit: $COMMIT (parents count=$PARENTS_COUNT)"
          else
            echo "is_merge=false" >> "$GITHUB_OUTPUT"
            echo "Not a merge commit: $COMMIT (parents count=$PARENTS_COUNT)"
          fi

  build:
    name: Build APK
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.is_merge == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Find APK file
        id: apk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK Found: $APK_NAME ($APK_SIZE)"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeAction-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Send Success Email Notification
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '✅ Android Build SUCCESS - ${{ github.event.head_commit.message }}'
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            🎉 **Android APK Build Successful!**

            📱 **Build Details:**
            - Project: CodeAction
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Commit Message: ${{ github.event.head_commit.message }}
            - Author: ${{ github.actor }}
            - Build Time: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            📦 **APK Information:**
            - Filename: ${{ steps.apk.outputs.name }}
            - Size: ${{ steps.apk.outputs.size }}
            - Location: ${{ steps.apk.outputs.path }}

            🔗 **Download APK:**
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ✨ The APK is available as an artifact in the workflow run.

            ---
            This is an automated message from GitHub Actions.

      - name: Send Failure Email Notification
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: '❌ Android Build FAILED - ${{ github.event.head_commit.message }}'
          to: ${{ secrets.RECIPIENT_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            ❌ **Android APK Build Failed!**

            📱 **Build Details:**
            - Project: CodeAction
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Commit Message: ${{ github.event.head_commit.message }}
            - Author: ${{ github.actor }}
            - Build Time: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ⚠️ **Please check the build logs for more details:**
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            This is an automated message from GitHub Actions.
